# This work flow includes source and PDF in Release.  It relies on the build-pdf workflow to create the PDF.
#
# NOTE: At this time it only runs manually.

name: Create Document Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. X.Y.Z:'
        required: true
        type: string
      prerelease:
        description: 'Tag as a pre-release?'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Create release as a draft?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build-pdf.yml
  release:
    runs-on: ubuntu-latest
    needs: build
    # Needed to create the release and upload its asset. The default token is
    # read-only on repositories configured that way, and the release step fails
    # late with a 403 rather than at start-up.
    permissions:
      contents: write
    steps:
    # download-artifact must stay on the same major as the upload in
    # build-pdf.yml. It was pinned at v2 while the build moved to v6, and
    # GitHub hard-fails deprecated artifact actions at "Set up job", so the
    # whole release job died before running a single step.
    - name: Download Artifacts
      uses: actions/download-artifact@v6
      with:
        name: ${{ needs.build.outputs.pdf-name }}

    # The asset is published under a versioned name, so rename the built PDF
    # before handing it to the release.
    - name: Name the release asset
      env:
        PDF_NAME: ${{ needs.build.outputs.pdf-name }}
        ASSET_NAME: ${{ needs.build.outputs.name }}_${{ github.event.inputs.version }}.pdf
      run: mv "$PDF_NAME" "$ASSET_NAME"

    # Replaces actions/create-release@v1 and actions/upload-release-asset@v1,
    # both of which were archived in 2021. This single action creates the
    # release and attaches the asset.
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: ${{ github.event.inputs.draft }}
        prerelease: ${{ github.event.inputs.prerelease }}
        files: ${{ needs.build.outputs.name }}_${{ github.event.inputs.version }}.pdf
